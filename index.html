<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blueprint</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f3ee; --ink:#16141c; --soft:#5c5666; --ember:#9a4a2a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#09080c; --ink:#f3efe6; --soft:#b7b0a4; --ember:#d08a62; } }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
    main { max-width:36rem; margin:0 auto; padding:3rem 1.5rem 5rem; }
    .kicker { text-transform:uppercase; letter-spacing:.12em; font-size:.72rem; color:var(--soft); }
    h1 { font-weight:560; font-size:2rem; letter-spacing:-.03em; }
    a { color:var(--ember); }
    ul { padding-left:1.15rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Blueprint</p>
    <h1>Legal and support</h1>
    <p>Policy pages for Blueprint: Life System. These pages describe how the 2.0 app works. They are not legal advice and have not been reviewed by a lawyer.</p>
    <ul>
      <li><a href="terms/">Terms of Use</a></li>
      <li><a href="privacy/">Privacy Policy</a></li>
      <li><a href="support/">Support</a></li>
    </ul>
  </main>
</body>
</html>
